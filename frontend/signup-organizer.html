<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer sign up | EventADDA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body class="auth-page"><header class="header"><a class="brand" href="index.html">Event<span>ADDA</span></a><a class="text-link" href="index.html">← Back to home</a></header><main class="auth-wrap"><section class="auth-card auth-card-wide"><span class="eyebrow">ORGANIZER SIGN UP</span><h1>Host events people love.</h1><p class="muted">Create an organizer account to publish events and collect registrations.</p><form id="signupForm" data-role="organizer"><div class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" required placeholder="Your name" autocomplete="name"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" required placeholder="+91 98765 43210" autocomplete="tel"></div><div class="field"><label for="signupEmail">Email address</label><input id="signupEmail" type="email" required placeholder="you@example.com" autocomplete="email"></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password"></div><div class="field"><label for="city">Preferred city for Event organization</label><input id="city" required placeholder="e.g. Mumbai"></div><div class="field"><label for="organization">Organization / Club name / College Name</label><input id="organization" required placeholder="e.g. Tech Club, IIT, Shree LR Tiwari College"></div></div><button class="btn btn-primary full-width" type="submit">Create my account →</button><p id="formMessage" class="form-message" aria-live="polite"></p></form><p class="auth-bottom">Already have an account? <a href="login-organizer.html">Log in</a></p><p class="auth-bottom">Looking to join events? <a href="signup-participant.html">Switch sign up</a></p><p class="fine-print">Your organizer account is saved securely to EventADDA.</p></section></main><script src="js/main.js"></script></body></html>
